- path: "run.num_epochs"
  value: 1
- path: "run.task"
  value:
    eval:
      is_train: false
      data: "eval"
      runner: "test"
      logging:
        interval: 100
        local:
          header: "Eval"
      batch_collective_communication:
        type: "time"
        interval: 10
- path: "run.data"
  value:
    eval:
      type: "siamese_tracker_eval"
      batch_size: 8
      num_io_threads: !const "num_io_threads_per_worker"
      num_workers: !const "num_eval_workers"
      source:
        type: "dataset"
        parameters:
          datasets:
            - name: "GOT10k"
              type: "SOT"
              splits: ["val"]
          filters:
            - type: "data_cleaning.annotation_standard"
              parameters:
                bounding_box_format: "XYXY"
                bounding_box_coordinate_system: "Continuous"
      sampler:
        type: "distributed_dynamic_scheduling"
        shuffle: false
      transform:
        type: "default"
        template_area_factor: 2.0
      result_collector:
        async_worker: true
        log_summary: true
        dispatch:
          - match:
              name_regex: ".*"
            handlers:
              - type: "one_pass_evaluation"
                file_name: "got10k_val"
- path: "run.runner"
  value:
    test:
      type: "default_eval"
      inference_engine:
        type: "plain"
        auto_mixed_precision:
          enabled: true
          dtype: "bfloat16"
        torch_compile:
          enabled: false
      evaluator:
        type: "default"
        pipeline:
          type: "one_stream_tracker"
          search_region_cropping:
            type: "simple"
            min_object_size: 10
            area_factor: 4.0
          post_process:
            type: "box_with_score_map"
            window_penalty: 0.45
          template_update:
            type: "simple"
            update_threshold: 0.84
            template_area_factor: 2.0
          visualization: false
          plugin:
            - type: "template_foreground_indicating_mask_generation"
            - type: "online_template_foreground_indicating_mask_generation"
              template_area_factor: 2.0
